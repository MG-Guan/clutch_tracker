timezone: America/Toronto
timestamp_format: iso8601

storage:
  backend: sqlite
  database_path: data/clutch_tracker.db
  atomic_writes: true

logging:
  level: INFO
  format: "%(asctime)s %(levelname)s %(name)s %(message)s"

reporting:
  daily_report_fields:
    - vin
    - year
    - make
    - model
    - price_cad
    - mileage_km
    - listing_url
    - first_seen_at
    - last_seen_at

scan:
  require_scan_complete_for_removals: true

# Runs only while `clutch-tracker serve` is alive. Stops when the process exits.
schedule:
  enabled: true
  interval_hours: 3
  run_on_startup: false
  generate_recommendations: true
  generate_daily_report: true
  request_browser_scan: true
  open_search_url: false
