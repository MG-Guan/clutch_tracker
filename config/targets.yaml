# Tracked vehicle search criteria for Clutch.ca.
# All vehicle criteria live here — never hard-code targets in Python.
#
# Model search:
#   make + model       — canonical make/model (e.g. Ford / F-150)
#   model_aliases      — alternate spellings agents may encounter (F150, F 150, …)
#   search_query       — optional free-text query for Clutch.ca search box
#
# Browser agents should call `show-target <target_id>` to get the full search payload.

targets:
  - target_id: ford-f150-ontario
    label: "Ontario Ford F-150"
    enabled: true
    criteria:
      make: Ford
      model: F-150
      model_aliases:
        - F150
        - F 150
        - F150XLT
      province: "ON"
      min_year: 2019
      max_year: 2024
      search_query: "Ford F-150"

  - target_id: pickup-trucks-ontario
    label: "Ontario pickup trucks (all makes)"
    enabled: true
    criteria:
      body_style: pickup
      province: "ON"
      min_year: 2019
      max_year: 2024

  - target_id: compact-suvs-ontario
    label: "Ontario compact SUVs"
    enabled: true
    criteria:
      body_style: suv
      province: "ON"
      min_year: 2020
      max_year: 2025

  - target_id: sedans-quebec
    label: "Quebec sedans"
    enabled: false
    criteria:
      body_style: sedan
      province: "QC"
      min_year: 2018
      max_year: 2024
